allowed_tasks = ["effect-modifier-survival-mlp8-pilot", "effect-modifier-survival-mlp8-shard"]
notes = "Disabled additive proposal only. Fixed raw-input float64 201-to-8-to-1 ReLU survival network, 30 epochs. Two scenario pilot requests own seeds 0 and 49: four paired scientific units, sixteen newly fitted models. Diag/KFAC and two pooled pseudo-value controls share data and public initialization. Archived dsLasso is used only for fingerprint checks; no archived neural model is replayed. Formal 300-seed cohort has 600 units, 2400 fitted models and 32 default deterministic shard requests. Same-source MLP8 scientific pilot, actual-producer evidence and operator runtime/memory review are required before formal admission. One-core/8192-MiB and 86400/604800-second values are provisional unmeasured admission estimates. Do not admit formal work before that gate. Do not replace existing tasks or use legacy launchers."

